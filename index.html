<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>tilo | دستیار هوشمند مطالعه و تحلیل کنکور</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        bgBase: '#0f172a', bgSurface: '#1e293b', bgElevated: '#263349',
                        primary: '#6366f1', primarySoft: '#818cf8', tealSoft: '#2dd4bf',
                        sage: '#34d399', amberSoft: '#fbbf24', roseSoft: '#f87171'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        window.FirebaseSDK = { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, getFirestore, doc, setDoc, getDoc };
    </script>

    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.08) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(45, 212, 191, 0.07) 0px, transparent 45%);
            background-attachment: fixed;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        [v-cloak] { display: none; }
        .soft-card {
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.2);
        }
        .input-calm {
            background: #172033;
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: #f1f5f9;
            border-radius: 0.85rem;
            padding: 0.7rem 0.95rem;
            width: 100%;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-calm:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18);
        }
        .btn-calm {
            padding: 0.7rem 1.2rem;
            border-radius: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-calm:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        body > div:not(#app) { display: none !important; }
    </style>
</head>
<body class="font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden select-none">
    <div id="app" class="w-full h-full flex flex-col md:flex-row max-w-7xl mx-auto relative" v-cloak>
        
        <!-- Onboarding Modal -->
        <div v-if="showWelcomeModal" class="fixed inset-0 z-[100000] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
            <div class="soft-card bg-[#162032] w-full max-w-md rounded-3xl p-6 md:p-8 border border-indigo-500/20 shadow-2xl text-center space-y-5">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-primary to-tealSoft mx-auto flex items-center justify-center shadow-lg shadow-primary/25">
                    <i class="fas fa-graduation-cap text-white text-3xl"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-white">به <span class="text-tealSoft">tilo</span> خوش آمدید</h2>
                    <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">دستیار هوشمند برنامه‌ریزی، تایمر مهندسی و تحلیلگر عملکرد مطالعاتی کنکور</p>
                </div>
                <div class="bg-slate-900/70 p-4 rounded-2xl border border-slate-800 text-right space-y-3">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1.5 font-bold">نام شما:</label>
                        <input type="text" v-model="settings.userName" placeholder="مثلاً: بنیامین" class="input-calm text-sm text-center font-bold">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1.5 font-bold">هدف مطالعه روزانه (دقیقه):</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" @click="settings.dailyGoal = 240" :class="settings.dailyGoal === 240 ? 'bg-primary text-white' : 'bg-slate-800 text-slate-300'" class="py-2 rounded-xl text-xs font-bold">۴ ساعت</button>
                            <button type="button" @click="settings.dailyGoal = 360" :class="settings.dailyGoal === 360 ? 'bg-primary text-white' : 'bg-slate-800 text-slate-300'" class="py-2 rounded-xl text-xs font-bold">۶ ساعت</button>
                            <button type="button" @click="settings.dailyGoal = 480" :class="settings.dailyGoal === 480 ? 'bg-primary text-white' : 'bg-slate-800 text-slate-300'" class="py-2 rounded-xl text-xs font-bold">۸ ساعت</button>
                        </div>
                    </div>
                </div>
                <div class="space-y-2.5 pt-1">
                    <button @click="completeWelcome" class="btn-calm bg-gradient-to-r from-primary to-tealSoft text-slate-950 font-black w-full py-3.5 text-sm shadow-lg shadow-primary/20">
                        <i class="fas fa-rocket"></i> ورود به داشبورد من
                    </button>
                    <button v-if="authInstance" @click="loginWithGoogle" class="btn-calm bg-white text-slate-900 hover:bg-slate-100 w-full py-3 text-xs font-extrabold">
                        <i class="fab fa-google text-rose-500 text-sm"></i> اتصال مستقیم به حساب Google
                    </button>
                </div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="soft-card w-full md:w-60 md:h-full flex md:flex-col justify-around md:justify-start p-2 md:p-4 order-last md:order-first z-50 fixed md:relative bottom-0 left-0 right-0 border-t md:border-t-0 md:border-l border-slate-800/80">
            <div class="hidden md:flex items-center gap-3 mb-6 px-2 pt-1">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary to-tealSoft flex items-center justify-center shadow-md">
                    <i class="fas fa-graduation-cap text-slate-950 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white">tilo</h1>
                    <span class="text-[11px] text-tealSoft font-medium">{{ settings.userName || 'نسخه کنکور ریاضی' }}</span>
                </div>
            </div>
            <button @click="currentTab = 'dashboard'" :class="navClass('dashboard')"><i class="fas fa-chart-pie text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">داشبورد و تحلیل</span></button>
            <button @click="currentTab = 'parts'" :class="navClass('parts')" class="relative"><i class="fas fa-layer-group text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">پارت‌ها</span><span v-if="pendingParts.length > 0" class="absolute top-1 right-2 md:top-auto md:left-3 bg-primary text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">{{ pendingParts.length }}</span></button>
            <button @click="currentTab = 'timer'" :class="navClass('timer')" class="relative"><i class="fas fa-stopwatch text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">تایمر حرفه‌ای</span><span v-if="timer.active" class="absolute top-1.5 right-3 w-2.5 h-2.5 bg-tealSoft rounded-full animate-ping"></span></button>
            <button @click="currentTab = 'calendar'" :class="navClass('calendar')"><i class="fas fa-calendar-week text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">برنامه هفتگی</span></button>
            <button @click="currentTab = 'archive'" :class="navClass('archive')"><i class="fas fa-folder-open text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">آرشیو آموزشی</span></button>
            <button @click="currentTab = 'calculator'" :class="navClass('calculator')"><i class="fas fa-percentage text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">درصدگیر</span></button>
            <button @click="currentTab = 'settings'" :class="navClass('settings')" class="md:mt-auto"><i class="fas fa-sliders-h text-base md:w-6"></i><span class="text-[10px] md:text-sm mt-1 md:mt-0">اکانت و تنظیمات</span></button>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-7 pb-28 md:pb-8">
            <header class="flex flex-wrap justify-between items-center gap-3 mb-6 bg-slate-800/40 p-3.5 rounded-2xl border border-slate-800">
                <div class="flex items-center gap-3">
                    <div @click="currentTab = 'settings'" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center cursor-pointer hover:border-primarySoft transition">
                        <i class="fas fa-user-astronaut text-tealSoft"></i>
                    </div>
                    <div>
                        <h2 class="text-base md:text-xl font-extrabold text-white flex items-center gap-2">
                            <span>{{ tabTitle }}</span>
                            <span v-if="settings.userName" class="text-xs font-normal text-slate-400 hidden sm:inline">| سلام {{ settings.userName }} 👋</span>
                        </h2>
                        <p class="text-slate-400 text-[11px] md:text-xs mt-0.5">{{ currentDateStr }}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="currentTab = 'settings'" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900/70 border border-slate-700/70 text
